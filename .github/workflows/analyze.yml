name: Analyze sample format
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/analyze.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create synthetic fixture and test analyzer
        run: |
          mkdir -p out
          python - <<'PY'
          from pathlib import Path
          data = bytearray(b"_" * 96)
          data[0:4] = b"EPK8"
          data[16:20] = b"PACH"
          data[32:36] = b"BPE "
          data[48:52] = b"DDS "
          Path("out/synthetic.pac").write_bytes(data)
          PY
          python tools/analyze_pac.py out/synthetic.pac --json out/report.json
          python - <<'PY'
          import json
          d=json.load(open("out/report.json", encoding="utf-8"))
          assert d["size_bytes"] == 96
          assert d["signatures"]["EPK8"] == [0]
          assert d["signatures"]["PACH"] == [16]
          assert d["signatures"]["BPE "] == [32]
          assert d["signatures"]["DDS "] == [48]
          assert d["pach_header_candidates"][0]["offset"] == 16
          assert len(d["marker_sequence"]) == 4
          assert d["marker_sequence"][1]["distance_from_previous_marker"] == 16
          assert any("not asserted to be chunk sizes" in s for s in d["limitations"])
          print("Synthetic offset/header/sequence tests passed.")
          PY
      - name: Test read-only SVRMOD ZIP inspection
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("out/sample.svrmod", "w") as z:
              z.writestr("manifest.txt", "type=superstar\\nid=test\\n")
              z.writestr("ch.pac", b"EPK8" + b"_" * 12 + b"PACH" + b"_" * 32)
          PY
          python tools/analyze_svrmod.py out/sample.svrmod --json out/archive-report.json
          python - <<'PY'
          import json
          d=json.load(open("out/archive-report.json", encoding="utf-8"))
          assert any(m["name"] == "manifest.txt" for m in d["members"])
          assert d["pac_analysis"]["signatures"]["EPK8"] == [0]
          assert d["pac_analysis"]["signatures"]["PACH"] == [16]
          print("Synthetic SVRMOD ZIP test passed.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: analyzer-test-report
          path: out/*.json
          retention-days: 3
